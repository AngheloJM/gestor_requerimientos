# Postgres local con la imagen oficial de Supabase (roles anon/authenticated/service_role,
# schema auth con auth.uid(), extensiones). Solo escucha en 127.0.0.1.
#
# Uso: ver infra/db/README.md
name: gestor-req

services:
  db:
    # TODO(verificar): usar la MISMA versión mayor que prod
    # (Supabase > Project Settings > Infrastructure). Se cambia con PG_IMAGE_TAG en .env.
    image: docker.io/supabase/postgres:${PG_IMAGE_TAG:-17.11.0.004}
    container_name: gestor-req-db
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en infra/db/.env}
      POSTGRES_DB: postgres
    volumes:
      - gestor_req_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  gestor_req_db:
